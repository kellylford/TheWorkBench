name: Release TheClaudeHub

# TheWorkBench holds several unrelated projects, so releases are scoped by tag prefix. A tag like
# theclaudehub-v0.1.0 tests TheClaudeHub, builds it with PyInstaller, signs it with Azure Artifact
# Signing, packs the Velopack installer, portable zip and update feed, checks every signature, and
# publishes a GitHub release.
#
#   (bump __version__ in TheClaudeHub/theclaudehub/__init__.py and add
#    TheClaudeHub/release-notes/v<version>.md in the same commit)
#   git tag theclaudehub-v0.1.0
#   git push origin theclaudehub-v0.1.0
#
# Run by hand (Actions, Run workflow) or for a pull request, it tests, builds and packs the same
# way and publishes nothing; the files are kept as a workflow artifact. A hand run with "sign"
# ticked, or a pull request labelled sign-build, also signs and checks the signatures, which
# proves signing works without a release.
#
# Velopack and signing follow GHManage's ghmanage.yml and The-Idea-Place-Projects/signing
# (lessons.md): sign the program first, then `vpk pack --azureTrustedSignFile` signs Setup, the
# updater and the launcher stub, and skips the program it finds already signed. TheClaudeHub uses
# its own Velopack channel, "theclaudehub", so its update feed (releases.theclaudehub.json) can't be
# confused with any other app released from this repository.

on:
  push:
    tags:
      - 'theclaudehub-v*'
  pull_request:
    # "labeled" so adding the sign-build label to a pull request re-runs it signed.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'TheClaudeHub/**'
      - '.github/workflows/release-theclaudehub.yml'
  workflow_dispatch:
    inputs:
      sign:
        description: 'Sign and check the signatures too (nothing is published either way)'
        type: boolean
        default: false

permissions:
  contents: write   # create the release (tag runs only)
  id-token: write   # the OIDC token azure/login exchanges for Azure credentials

concurrency:
  group: release-theclaudehub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    # Matches the OIDC subject the Azure federated credential trusts. It is not a gate: the
    # environment is unprotected.
    environment: azure-signing
    defaults:
      run:
        shell: pwsh
        working-directory: TheClaudeHub
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/theclaudehub-v') }}
      # Signs for a tag; for a hand run with "sign" ticked; and for a pull request labelled
      # sign-build, which proves signing before a workflow change reaches main (a hand run can
      # only start a workflow that is already on main). Nothing but a tag publishes.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/theclaudehub-v') || (github.event_name == 'workflow_dispatch' && inputs.sign) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'sign-build')) }}
      CHANNEL: theclaudehub
    steps:
      # Pinned to release commits (v4.4.0, v5.6.0), like theclaudehub-tests.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: TheClaudeHub/requirements*.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller

      # Before anything is built or signed, so a failing test stops a release.
      - name: Test
        run: python -m pytest -q tests

      # One version, in theclaudehub/__init__.py. A tag that disagrees fails here, before anything
      # is built: the updater compares installed and published versions, so they must match.
      - name: Version
        run: |
          if ($env:PUBLISH -eq 'true') {
            $version = python tools/check_version.py $env:GITHUB_REF_NAME
          } else {
            $version = python tools/check_version.py
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $notes = "release-notes/v$version.md"
          if (-not (Test-Path $notes)) { throw "Write $notes before releasing $version." }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
          "NOTES=$notes" | Out-File $env:GITHUB_ENV -Append
          Write-Host "TheClaudeHub $version"

      # --onedir, not --onefile: Velopack swaps an app folder in place, and a onefile exe would
      # unpack itself on every start. velopack is imported lazily, so it is named explicitly; the
      # speech scripts are data files.
      - name: Build
        run: |
          python tools/make_version_info.py
          python -m PyInstaller --noconfirm --clean --noconsole --onedir --name TheClaudeHub `
            --version-file build/version_info.txt --hidden-import velopack `
            --add-data "theclaudehub/speech;theclaudehub/speech" TheClaudeHub.pyw
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The built app imports everything and checks its data files, without opening a window, so
      # a module PyInstaller missed fails the run here rather than on someone's PC.
      - name: Smoke test the built app
        run: |
          $p = Start-Process dist\TheClaudeHub\TheClaudeHub.exe -ArgumentList '--smoke-test', 'smoke.json' -Wait -PassThru
          Get-Content smoke.json
          if ($p.ExitCode -ne 0) { throw "The built app's smoke test failed (exit $($p.ExitCode))." }

      - name: Azure login (code signing)
        if: env.SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the app
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: kellylford
          certificate-profile-name: kellyford-public
          files-folder: ${{ github.workspace }}\TheClaudeHub\dist\TheClaudeHub
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # UTF-8 without a byte-order mark: vpk's --azureTrustedSignFile reader needs exactly that.
      - name: Write signing metadata
        if: env.SIGN == 'true'
        run: |
          $json = @{
            Endpoint               = 'https://eus.codesigning.azure.net/'
            CodeSigningAccountName = 'kellylford'
            CertificateProfileName = 'kellyford-public'
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\signing-metadata.json", $json)

      - name: Install vpk
        run: dotnet tool install -g vpk

      # The previous release's packages let vpk build a delta update. There are none before the
      # first release, so this may fail.
      - name: Download the previous release's packages
        if: env.PUBLISH == 'true'
        continue-on-error: true
        run: >
          vpk download github --repoUrl https://github.com/kellylford/TheWorkBench
          --channel ${{ env.CHANNEL }} --pre --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir releases

      - name: Pack the installer, portable zip and update feed
        run: |
          $sign = @()
          if ($env:SIGN -eq 'true') { $sign = @('--azureTrustedSignFile', "$env:GITHUB_WORKSPACE\signing-metadata.json") }
          vpk pack --packId TheClaudeHub --packVersion $env:VERSION `
            --packDir dist/TheClaudeHub --mainExe TheClaudeHub.exe `
            --packTitle TheClaudeHub --packAuthors "Kelly Ford" `
            --channel $env:CHANNEL --outputDir releases `
            --instLocation PerUser --shortcuts StartMenuRoot `
            --releaseNotes $env:NOTES @sign
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem releases | Select-Object Name, Length

      # A tag can never publish anything unsigned. Checks every program a user runs: Setup, the
      # app in the portable zip, and the app, updater and launcher inside the full package.
      - name: Check every signature
        if: env.SIGN == 'true'
        run: |
          $check = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\sigcheck"
          $files = @(Get-ChildItem releases\*.exe)
          Expand-Archive "releases\TheClaudeHub-$env:CHANNEL-Portable.zip" "$check\portable" -Force
          $files += Get-ChildItem "$check\portable" -Recurse -Filter *.exe
          foreach ($pkg in Get-ChildItem "releases\TheClaudeHub-$env:VERSION-$env:CHANNEL-full.nupkg") {
            Copy-Item $pkg.FullName "$check\full.zip"
            Expand-Archive "$check\full.zip" "$check\full" -Force
            $files += Get-ChildItem "$check\full\lib\app" -Filter *.exe
          }
          $bad = 0
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status), $($sig.SignerCertificate.Subject), timestamped: $([bool]$sig.TimeStamperCertificate)"
            if ($sig.Status -ne 'Valid') { $bad++ }
          }
          if ($files.Count -lt 4) { throw "Expected at least 4 programs to check, found $($files.Count)." }
          if ($bad) { throw "$bad program(s) aren't validly signed." }

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: theclaudehub-${{ env.VERSION }}-${{ env.SIGN == 'true' && 'signed' || 'unsigned' }}
          path: |
            TheClaudeHub/releases/*
          if-no-files-found: error
          retention-days: 14

      # The feed files (releases.theclaudehub.json, assets.theclaudehub.json, RELEASES-theclaudehub)
      # and the full package are what installed copies update from, so they go up with the
      # installer and portable zip. Before 1.0 a release is a pre-release; the updater includes
      # pre-releases.
      - name: Create the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pre = @()
          if ($env:VERSION.StartsWith('0.')) { $pre = @('--prerelease') }
          $assets = Get-ChildItem releases -File | Where-Object {
            $_.Name -like "TheClaudeHub-*-$env:CHANNEL-*.nupkg" -or
            $_.Name -in @("TheClaudeHub-$env:CHANNEL-Setup.exe", "TheClaudeHub-$env:CHANNEL-Portable.zip",
                          "releases.$env:CHANNEL.json", "assets.$env:CHANNEL.json", "RELEASES-$env:CHANNEL")
          } | ForEach-Object { $_.FullName }
          if ($assets.Count -lt 6) { throw "Expected the installer, portable zip, package and three feed files; found $($assets.Count)." }
          gh release create $env:GITHUB_REF_NAME @assets --title "TheClaudeHub $env:VERSION" --notes-file $env:NOTES @pre
