name: Release ClaudeSpeak

# TheWorkBench holds several unrelated projects, so releases are scoped by tag prefix rather
# than by repository. A tag like claudespeak-v1.0 releases only ClaudeSpeak; another project
# can take its own prefix later without colliding.
#
# The zip exists because GitHub has no way to download a single folder. Without it, anyone
# following a link to ClaudeSpeak/ has to clone the whole repository or save the files one at
# a time.
#
#   git tag claudespeak-v1.0
#   git push origin claudespeak-v1.0

on:
  push:
    tags:
      - 'claudespeak-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sanity-check the payload
        run: |
          test -f ClaudeSpeak/README.md
          test -f ClaudeSpeak/install.bat
          test -f ClaudeSpeak/install.ps1
          test -f ClaudeSpeak/scripts/speak-response.ps1
          test -f ClaudeSpeak/skills/voice-setup/SKILL.md
          test -f ClaudeSpeak/install.sh
          test -f ClaudeSpeak/scripts-macos/speak-response.sh
          test -f ClaudeSpeak/scripts-macos/speak-engine.sh
          test -f ClaudeSpeak/scripts-macos/speak-voices.sh
          test -f ClaudeSpeak/skills-macos/voice-setup/SKILL.md
          # The zip must preserve the executable bit, or install.sh cannot be run from the
          # extracted folder without a chmod the README does not mention.
          test -x ClaudeSpeak/install.sh
          for f in ClaudeSpeak/scripts-macos/*.sh; do test -x "$f" || { echo "not executable: $f"; exit 1; }; done
          bash -n ClaudeSpeak/install.sh
          for f in ClaudeSpeak/scripts-macos/*.sh; do bash -n "$f"; done
          echo "payload looks complete"

      - name: Build the zip
        run: |
          # Zipped from the repo root so it expands into a ClaudeSpeak/ folder rather than
          # scattering loose files wherever the user extracted it.
          zip -r "ClaudeSpeak-${GITHUB_REF_NAME}.zip" ClaudeSpeak -x '*/.git*'
          unzip -l "ClaudeSpeak-${GITHUB_REF_NAME}.zip"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Makes Claude Code read its replies aloud — through JAWS, NVDA, VoiceOver, or a system
          voice on either platform.

          **Install:** download the zip below, extract it, and from inside the ClaudeSpeak folder
          run `install.bat` on Windows or `./install.sh` on macOS. Then restart Claude Code.
          There is a manual path in the README if you would rather not run a script, and
          `install.ps1 -WhatIf` / `install.sh --dry-run` show what they would do without changing
          anything.

          Read the [README](https://github.com/kellylford/TheWorkBench/tree/main/ClaudeSpeak)
          first — particularly the note on what does and does not get read aloud.

          **macOS needs one checkbox.** The VoiceOver route requires *VoiceOver Utility → General
          → "Allow VoiceOver to be controlled with AppleScript"*, which is off by default. With it
          off the route is silent **and reports success** — no error, exit status 0. Check that
          first if nothing speaks. macOS also needs `jq`, which ships with 15 and later; on 13 or
          14, `brew install jq`.

          **Scope of testing.** Every route listed is verified working, but each on exactly one
          machine — Windows on ARM, and Apple silicon on macOS 27. Both installers were exercised
          against fresh installs, merging into an existing settings file, adding alongside an
          existing Stop hook, repeat runs, and malformed JSON — but never on anyone else's setup.
          Reports welcome.

          If something does not speak, the useful first two things are the route log
          (`%TEMP%\claude-speak\last-route.log`, or `$TMPDIR/claude-speak/last-route.log`) and the
          output of `speak-voices.ps1` / `speak-voices.sh`. A clean run only proves *something*
          spoke, not that your chosen route did.
          NOTES

          gh release create "$GITHUB_REF_NAME" \
            "ClaudeSpeak-${GITHUB_REF_NAME}.zip" \
            --title "ClaudeSpeak ${GITHUB_REF_NAME#claudespeak-}" \
            --notes-file notes.md
