name: TheClaudeHub tests

# Runs TheClaudeHub's pytest suite on Windows, the platform it targets: the
# process-tree, pipe and path handling it tests are Windows-specific. The UI
# tests build the window hidden, which works on a runner without a desktop.
#
# Scoped by path so changes elsewhere in this repo don't trigger it.

on:
  push:
    branches: [main]
    paths:
      - 'TheClaudeHub/**'
      - '.github/workflows/theclaudehub-tests.yml'
  pull_request:
    paths:
      - 'TheClaudeHub/**'
      - '.github/workflows/theclaudehub-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theclaudehub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: TheClaudeHub
    steps:
      # Pinned to release commits (v4.4.0, v5.6.0).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: TheClaudeHub/requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q tests
