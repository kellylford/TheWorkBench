name: Publish site

# Despite the original name, this publishes the WHOLE site: it rsyncs the repo
# into _site and force-pushes that to gh-pages. Converting one markdown file with
# pandoc is a single step among everything else it carries.
#
# It used to trigger only on that one markdown file, which meant every change to
# either card game had to be published by hand — and a merge by anyone who did
# not know that left the live site silently behind main. The games are what
# people actually visit, so they trigger it too.
#
# Everything reaching main goes through a pull request and the card game tests
# run on every pull request, so this is not publishing untested code.

on:
  push:
    branches:
      - main
    paths:
      - 'devdocs/CONTROLLING_IPHONE_FROM_MAC.md'
      - 'sheephead/**'
      - 'Cribbage/**'
      - 'thecardplace.html'
      - '.github/workflows/publish-guide.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '3.1.11'

      - name: Convert Markdown to HTML
        run: |
          mkdir -p _site/devdocs
          rsync -a --exclude='_site' . _site/
          pandoc \
            --from markdown+smart \
            --to html5 \
            --template .github/pandoc-template.html5 \
            --standalone \
            devdocs/CONTROLLING_IPHONE_FROM_MAC.md \
            --output _site/devdocs/controlling-iphone-from-mac.html
          # Remove .gitignore from _site so the action doesn't exclude the generated HTML
          rm -f _site/.gitignore

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish: auto-generated HTML from markdown"
